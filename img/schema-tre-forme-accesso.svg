<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Le tre forme di accesso agli atti a confronto: documentale, civico semplice e civico generalizzato.">
  <style>
    .t { font-family: Spectral, Georgia, serif; }
    .m { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .s { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .cap  { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
    .nome { font-size: 17px; font-weight: 600; }
    .voce { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .val  { font-size: 12.5px; }
  </style>

  <rect width="760" height="400" fill="#F5F0E6"/>

  <text x="0" y="16" class="m cap" fill="#9E2B25">Tre porte diverse, due leggi diverse</text>
  <line x1="0" y1="28" x2="760" y2="28" stroke="#111D30" stroke-opacity="0.18"/>

  <!-- colonna 1 -->
  <g>
    <rect x="0" y="46" width="240" height="336" fill="#111D30"/>
    <text x="20" y="76" class="m cap" fill="#C98A85">Porta 1</text>
    <text x="20" y="104" class="t nome" fill="#F5F0E6">Documentale</text>
    <text x="20" y="126" class="m" font-size="11" fill="#F5F0E6" fill-opacity="0.62">L. 241/1990, artt. 22 ss.</text>
    <line x1="20" y1="144" x2="220" y2="144" stroke="#F5F0E6" stroke-opacity="0.22"/>
    <text x="20" y="170" class="m voce" fill="#C98A85">Chi può chiedere</text>
    <text x="20" y="190" class="s val" fill="#F5F0E6">Solo chi ha un interesse</text>
    <text x="20" y="207" class="s val" fill="#F5F0E6">diretto, concreto e attuale</text>
    <text x="20" y="240" class="m voce" fill="#C98A85">Va motivata?</text>
    <text x="20" y="260" class="s val" fill="#F5F0E6">Sì</text>
    <text x="20" y="293" class="m voce" fill="#C98A85">Cosa si ottiene</text>
    <text x="20" y="313" class="s val" fill="#F5F0E6">I documenti che riguardano</text>
    <text x="20" y="330" class="s val" fill="#F5F0E6">la tua posizione</text>
    <text x="20" y="362" class="s" font-size="11.5" fill="#F5F0E6" fill-opacity="0.55">Non serve a controllare</text>
    <text x="20" y="377" class="s" font-size="11.5" fill="#F5F0E6" fill-opacity="0.55">in generale la PA</text>
  </g>

  <!-- colonna 2 -->
  <g>
    <rect x="260" y="46" width="240" height="336" fill="none" stroke="#111D30" stroke-opacity="0.28"/>
    <text x="280" y="76" class="m cap" fill="#9E2B25">Porta 2</text>
    <text x="280" y="104" class="t nome" fill="#111D30">Civico semplice</text>
    <text x="280" y="126" class="m" font-size="11" fill="#4A5468">D.lgs. 33/2013, art. 5 c. 1</text>
    <line x1="280" y1="144" x2="480" y2="144" stroke="#111D30" stroke-opacity="0.16"/>
    <text x="280" y="170" class="m voce" fill="#9E2B25">Chi può chiedere</text>
    <text x="280" y="190" class="s val" fill="#111D30">Chiunque</text>
    <text x="280" y="240" class="m voce" fill="#9E2B25">Va motivata?</text>
    <text x="280" y="260" class="s val" fill="#111D30">No</text>
    <text x="280" y="293" class="m voce" fill="#9E2B25">Cosa si ottiene</text>
    <text x="280" y="313" class="s val" fill="#111D30">Solo ciò che andava</text>
    <text x="280" y="330" class="s val" fill="#111D30">pubblicato e non lo è stato</text>
    <text x="280" y="362" class="s" font-size="11.5" fill="#4A5468">L'oggetto è ristretto agli</text>
    <text x="280" y="377" class="s" font-size="11.5" fill="#4A5468">obblighi di pubblicazione</text>
  </g>

  <!-- colonna 3 -->
  <g>
    <rect x="520" y="46" width="240" height="336" fill="none" stroke="#111D30" stroke-opacity="0.28"/>
    <text x="540" y="76" class="m cap" fill="#9E2B25">Porta 3</text>
    <text x="540" y="104" class="t nome" fill="#111D30">Civico generalizzato</text>
    <text x="540" y="126" class="m" font-size="11" fill="#4A5468">D.lgs. 33/2013, art. 5 c. 2</text>
    <line x1="540" y1="144" x2="740" y2="144" stroke="#111D30" stroke-opacity="0.16"/>
    <text x="540" y="170" class="m voce" fill="#9E2B25">Chi può chiedere</text>
    <text x="540" y="190" class="s val" fill="#111D30">Chiunque</text>
    <text x="540" y="240" class="m voce" fill="#9E2B25">Va motivata?</text>
    <text x="540" y="260" class="s val" fill="#111D30">No</text>
    <text x="540" y="293" class="m voce" fill="#9E2B25">Cosa si ottiene</text>
    <text x="540" y="313" class="s val" fill="#111D30">Dati e documenti</text>
    <text x="540" y="330" class="s val" fill="#111D30">anche ulteriori</text>
    <text x="540" y="362" class="s" font-size="11.5" fill="#4A5468">Il limite sono le esclusioni</text>
    <text x="540" y="377" class="s" font-size="11.5" fill="#4A5468">dell'art. 5-bis</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 470" width="330" height="470"
     role="img" aria-label="Chi può presentare domanda nella riapertura del concorso Difesa"
     style="min-width:0;max-width:340px;margin:0 auto">
  <style>
    .bg   { fill:#F5F0E6; }
    .card { fill:#ffffff; stroke:#D8D0BE; stroke-width:1; }
    .head { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
            fill:#9E2B25; letter-spacing:1.6px; }
    .tit  { font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:500; fill:#111D30;
            letter-spacing:0.6px; }
    .tit-no { font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:500;
            fill:#4A5468; letter-spacing:0.6px; }
    .v    { font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; fill:#111D30; }
    .no   { font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; fill:#4A5468; }
    .foot { font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; fill:#4A5468; }
    .dot  { fill:#9E2B25; }
    .dash { fill:#9AA2B1; }
  </style>

  <rect class="bg" x="0" y="0" width="330" height="470"/>
  <text class="head" x="14" y="22">RIAPERTURA FINO AL 5 DICEMBRE</text>
  <line x1="14" y1="32" x2="316" y2="32" stroke="#9E2B25" stroke-width="2"/>

  <rect class="card" x="14" y="46" width="302" height="186" rx="2" stroke="#9E2B25" stroke-width="2"/>
  <text class="tit" x="28" y="72">PUÒ FARE DOMANDA</text>
  <circle class="dot" cx="31" cy="97" r="2.5"/>
  <text class="v" x="41" y="101">Cittadini di altri Stati dell'Unione</text>
  <circle class="dot" cx="31" cy="124" r="2.5"/>
  <text class="v" x="41" y="128">I loro familiari con diritto</text>
  <text class="v" x="41" y="145">di soggiorno</text>
  <circle class="dot" cx="31" cy="168" r="2.5"/>
  <text class="v" x="41" y="172">Chi ha il permesso UE per</text>
  <text class="v" x="41" y="189">soggiornanti di lungo periodo</text>
  <circle class="dot" cx="31" cy="212" r="2.5"/>
  <text class="v" x="41" y="216">Rifugiati e protezione sussidiaria</text>

  <rect class="card" x="14" y="244" width="302" height="100" rx="2"/>
  <text class="tit-no" x="28" y="270">NON RIENTRA</text>
  <rect class="dash" x="29" y="293" width="6" height="1.6"/>
  <text class="no" x="41" y="299">Chi ha la cittadinanza italiana:</text>
  <text class="no" x="41" y="316">la sua finestra era il bando</text>
  <text class="no" x="41" y="333">originario, chiuso il 27 gennaio</text>

  <text class="foot" x="14" y="372">I requisiti si misurano al 27 gennaio 2026,</text>
  <text class="foot" x="14" y="389">non alla data della nuova domanda.</text>
  <text class="foot" x="14" y="415">Chi ha già presentato domanda allora</text>
  <text class="foot" x="14" y="432">non deve rifare nulla: vale anche</text>
  <text class="foot" x="14" y="449">la prova già sostenuta a ottobre.</text>
</svg>

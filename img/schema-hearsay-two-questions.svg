<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 470" width="330" height="470"
     role="img" aria-label="The two questions that decide whether a statement is hearsay"
     style="min-width:0;max-width:340px;margin:0 auto">
  <style>
    .bg    { fill:#F5F0E6; }
    .card  { fill:#ffffff; stroke:#D8D0BE; stroke-width:1; }
    .head  { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
             fill:#9E2B25; letter-spacing:1.6px; }
    .q     { font-family:"IBM Plex Sans",sans-serif; font-size:13px; font-weight:600; fill:#111D30; }
    .a     { font-family:"IBM Plex Sans",sans-serif; font-size:12px; fill:#4A5468; }
    .tag   { font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
             fill:#4A5468; letter-spacing:0.8px; }
    .tagr  { font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
             fill:#9E2B25; letter-spacing:0.8px; }
  </style>

  <rect class="bg" x="0" y="0" width="330" height="470"/>
  <text class="head" x="14" y="22">IS IT HEARSAY?</text>
  <line x1="14" y1="32" x2="316" y2="32" stroke="#9E2B25" stroke-width="2"/>

  <rect class="card" x="14" y="48" width="302" height="92" rx="2"/>
  <text class="tag" x="28" y="72">QUESTION 1</text>
  <text class="q" x="28" y="96">Was it said outside this</text>
  <text class="q" x="28" y="114">hearing?</text>
  <text class="a" x="28" y="132">A witness on the stand is never the problem.</text>

  <line x1="165" y1="140" x2="165" y2="166" stroke="#D8D0BE" stroke-width="2"/>
  <text class="a" x="176" y="158">yes</text>

  <rect class="card" x="14" y="168" width="302" height="92" rx="2"/>
  <text class="tag" x="28" y="192">QUESTION 2</text>
  <text class="q" x="28" y="216">Is it offered to prove that</text>
  <text class="q" x="28" y="234">what it says is true?</text>
  <text class="a" x="28" y="252">Identify the purpose of the offer, not the words.</text>

  <line x1="100" y1="260" x2="100" y2="292" stroke="#D8D0BE" stroke-width="2"/>
  <line x1="240" y1="260" x2="240" y2="292" stroke="#D8D0BE" stroke-width="2"/>
  <text class="a" x="72" y="280">yes</text>
  <text class="a" x="249" y="280">no</text>

  <rect class="card" x="14" y="294" width="142" height="86" rx="2" stroke="#9E2B25" stroke-width="2"/>
  <text class="tagr" x="28" y="318">HEARSAY</text>
  <text class="a" x="28" y="340">Barred by Rule 802,</text>
  <text class="a" x="28" y="357">unless an exception</text>
  <text class="a" x="28" y="374">lets it in.</text>

  <rect class="card" x="174" y="294" width="142" height="86" rx="2"/>
  <text class="tag" x="188" y="318">NOT HEARSAY</text>
  <text class="a" x="188" y="340">Notice, effect on</text>
  <text class="a" x="188" y="357">the listener, words</text>
  <text class="a" x="188" y="374">with legal effect.</text>

  <rect class="card" x="14" y="394" width="302" height="62" rx="2"/>
  <text class="a" x="28" y="416">Rule 801(d) removes two groups from the</text>
  <text class="a" x="28" y="433">definition: a testifying witness's earlier</text>
  <text class="a" x="28" y="450">statement, and an opposing party's statement.</text>
</svg>

<svg viewBox="0 0 330 444" style="min-width:0;max-width:340px;margin:0 auto" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="I 300 posti del concorso INL per ispettori di vigilanza tecnica divisi per regione: Lombardia 108, Veneto 50, Emilia-Romagna 40, Piemonte 35, Toscana 27, Liguria 20, Friuli-Venezia Giulia 15, Valle d'Aosta 5. Le procedure sono otto, ciascuna con una graduatoria distinta, e la domanda vale per una regione sola: candidarsi in più regioni porta all'esclusione. Le domande si chiudono il 19 dicembre 2026.">
  <style>
    .m { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .s { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .cap { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; }
    .num { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; }
    .vce { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 10.5px; }
  </style>
  <rect width="330" height="444" fill="#F5F0E6"/>

  <text x="0" y="13" class="cap" fill="#9E2B25">300 posti, otto concorsi</text>
  <line x1="0" y1="24" x2="330" y2="24" stroke="#111D30" stroke-opacity="0.18"/>
  <text x="0" y="42" class="s" font-size="11" fill="#4A5468">I posti per regione, e la graduatoria</text>
  <text x="0" y="57" class="s" font-size="11" fill="#4A5468">in cui si entra scegliendola.</text>

  <g>
    <text x="0" y="86" class="vce" fill="#111D30">Lombardia</text>
    <text x="330" y="86" text-anchor="end" class="num" fill="#111D30">108</text>
    <rect x="0" y="92" width="190" height="8" fill="#111D30"/>

    <text x="0" y="120" class="vce" fill="#111D30">Veneto</text>
    <text x="330" y="120" text-anchor="end" class="num" fill="#111D30">50</text>
    <rect x="0" y="126" width="88" height="8" fill="#111D30"/>

    <text x="0" y="154" class="vce" fill="#111D30">Emilia-Romagna</text>
    <text x="330" y="154" text-anchor="end" class="num" fill="#111D30">40</text>
    <rect x="0" y="160" width="70.4" height="8" fill="#111D30"/>

    <text x="0" y="188" class="vce" fill="#111D30">Piemonte</text>
    <text x="330" y="188" text-anchor="end" class="num" fill="#111D30">35</text>
    <rect x="0" y="194" width="61.6" height="8" fill="#111D30"/>

    <text x="0" y="222" class="vce" fill="#111D30">Toscana</text>
    <text x="330" y="222" text-anchor="end" class="num" fill="#111D30">27</text>
    <rect x="0" y="228" width="47.5" height="8" fill="#111D30"/>

    <text x="0" y="256" class="vce" fill="#111D30">Liguria</text>
    <text x="330" y="256" text-anchor="end" class="num" fill="#111D30">20</text>
    <rect x="0" y="262" width="35.2" height="8" fill="#111D30"/>

    <text x="0" y="290" class="vce" fill="#111D30">Friuli-Venezia Giulia</text>
    <text x="330" y="290" text-anchor="end" class="num" fill="#111D30">15</text>
    <rect x="0" y="296" width="26.4" height="8" fill="#111D30"/>

    <text x="0" y="324" class="vce" fill="#111D30">Valle d'Aosta</text>
    <text x="330" y="324" text-anchor="end" class="num" fill="#9E2B25">5</text>
    <rect x="0" y="330" width="8.8" height="8" fill="#9E2B25"/>
  </g>

  <line x1="0" y1="356" x2="330" y2="356" stroke="#111D30" stroke-opacity="0.18"/>

  <g>
    <text x="0" y="376" class="cap" fill="#9E2B25">Una domanda, un codice</text>
    <text x="0" y="396" class="vce" fill="#111D30">Le graduatorie sono otto, una per regione.</text>
    <text x="0" y="412" class="vce" fill="#111D30">Candidarsi in più regioni porta all'esclusione.</text>
    <text x="0" y="436" class="m" font-size="10.5" fill="#4A5468">Domande entro il 19 dicembre 2026</text>
  </g>
</svg>

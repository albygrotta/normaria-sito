<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 470" width="330" height="470"
     role="img" aria-label="La preselezione del concorso IVASS: scatta oltre 1.500 domande, assegna fino a 6,10 punti ai titoli e ammette allo scritto i primi 1.500 candidati."
     style="min-width:0;max-width:340px;margin:0 auto">
  <rect x="0" y="0" width="330" height="470" fill="#F5F0E6"/>

  <text x="165" y="26" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9"
        letter-spacing="1.8" fill="#9E2B25">PRESELEZIONE PER TITOLI</text>
  <text x="165" y="45" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5"
        fill="#111D30">Concorso IVASS, 10 esperti giuridici</text>

  <!-- condizione -->
  <rect x="18" y="60" width="294" height="46" fill="none" stroke="#111D30" stroke-width="1"/>
  <text x="32" y="78" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="1.4"
        fill="#9E2B25">QUANDO SCATTA</text>
  <text x="32" y="96" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#111D30">Solo se le domande superano 1.500</text>

  <line x1="165" y1="106" x2="165" y2="124" stroke="#4A5468" stroke-width="1"/>
  <path d="M160 124 L165 132 L170 124 Z" fill="#4A5468"/>

  <!-- punteggio titoli -->
  <rect x="18" y="134" width="294" height="172" fill="none" stroke="#111D30" stroke-width="1"/>
  <text x="32" y="152" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="1.4"
        fill="#9E2B25">PUNTEGGIO AI TITOLI · MAX 6,10</text>

  <text x="32" y="174" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#111D30">Voto di laurea</text>
  <text x="298" y="174" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#111D30">3,00</text>
  <text x="32" y="190" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#4A5468">105 = 0 · 106-107 = 1 · 108-109 = 2 · lode = 3</text>
  <line x1="32" y1="202" x2="298" y2="202" stroke="#4A5468" stroke-width="0.5"/>

  <text x="32" y="222" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#111D30">Dottorato di ricerca</text>
  <text x="298" y="222" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#111D30">1,50</text>
  <line x1="32" y1="234" x2="298" y2="234" stroke="#4A5468" stroke-width="0.5"/>

  <text x="32" y="254" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#111D30">Diploma di specializzazione</text>
  <text x="298" y="254" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#111D30">0,90</text>
  <line x1="32" y1="266" x2="298" y2="266" stroke="#4A5468" stroke-width="0.5"/>

  <text x="32" y="286" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#111D30">Master di II livello</text>
  <text x="298" y="286" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#111D30">0,70</text>

  <line x1="165" y1="306" x2="165" y2="324" stroke="#4A5468" stroke-width="1"/>
  <path d="M160 324 L165 332 L170 324 Z" fill="#4A5468"/>

  <!-- esito -->
  <rect x="18" y="334" width="294" height="62" fill="#111D30"/>
  <text x="32" y="354" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="1.4"
        fill="#F5F0E6">CHI PASSA</text>
  <text x="32" y="372" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#F5F0E6">I primi 1.500 vanno alla prova scritta</text>
  <text x="32" y="388" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#F5F0E6" opacity="0.8">più i pari merito all'ultimo posto utile</text>

  <line x1="18" y1="414" x2="86" y2="414" stroke="#9E2B25" stroke-width="2"/>

  <text x="18" y="434" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#4A5468">Il punteggio dei titoli non si somma al voto finale:</text>
  <text x="18" y="449" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#4A5468">serve solo a entrare nello scritto.</text>
</svg>

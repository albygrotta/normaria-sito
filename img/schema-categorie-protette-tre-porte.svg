<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 470" width="330" height="470"
     role="img" aria-label="Le tre condizioni per essere ammessi a un concorso riservato alle categorie protette"
     style="min-width:0;max-width:340px;margin:0 auto">
  <style>
    .bg   { fill:#F5F0E6; }
    .card { fill:#ffffff; stroke:#D8D0BE; stroke-width:1; }
    .head { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
            fill:#9E2B25; letter-spacing:1.6px; }
    .num  { font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:500;
            fill:#9E2B25; }
    .tit  { font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:500;
            fill:#111D30; letter-spacing:0.6px; }
    .lab  { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
            fill:#9E2B25; letter-spacing:1px; }
    .v    { font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; fill:#111D30; }
    .foot { font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; fill:#4A5468; }
  </style>

  <rect class="bg" x="0" y="0" width="330" height="470"/>
  <text class="head" x="14" y="22">CONCORSO RISERVATO: CHI È AMMESSO</text>
  <line x1="14" y1="32" x2="316" y2="32" stroke="#9E2B25" stroke-width="2"/>

  <rect class="card" x="14" y="46" width="302" height="202" rx="2"/>
  <text class="num" x="28" y="71">1</text>
  <text class="tit" x="44" y="71">LA CATEGORIA</text>
  <text class="lab" x="28" y="97">ART. 1</text>
  <text class="v"   x="28" y="117">Disabilità oltre il 45%, o 33%</text>
  <text class="v"   x="28" y="134">se del lavoro. Non vedenti,</text>
  <text class="v"   x="28" y="151">sordomuti, invalidi di guerra.</text>
  <text class="lab" x="28" y="177">ART. 18</text>
  <text class="v"   x="28" y="197">Orfani e coniugi superstiti,</text>
  <text class="v"   x="28" y="214">vittime del terrorismo, testimoni</text>
  <text class="v"   x="28" y="231">di giustizia, profughi rimpatriati.</text>

  <text class="foot" x="14" y="270">Il bando sceglie: l'Agenzia delle Entrate</text>
  <text class="foot" x="14" y="287">ammette solo l'art. 1, il Vanvitelli entrambi.</text>

  <rect class="card" x="14" y="301" width="302" height="72" rx="2"/>
  <text class="num" x="28" y="326">2</text>
  <text class="tit" x="44" y="326">L'ISCRIZIONE</text>
  <text class="v"   x="28" y="350">Negli elenchi del collocamento</text>
  <text class="v"   x="28" y="367">mirato, al centro per l'impiego.</text>

  <rect class="card" x="14" y="381" width="302" height="50" rx="2"/>
  <text class="num" x="28" y="406">3</text>
  <text class="tit" x="44" y="406">LA DISOCCUPAZIONE</text>
  <text class="v"   x="28" y="425">Solo dove il bando la chiede.</text>

  <text class="foot" x="14" y="455">Tutto alla scadenza della domanda: dopo non si sana.</text>
</svg>

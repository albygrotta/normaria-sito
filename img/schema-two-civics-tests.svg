<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 462" width="330" height="462"
     role="img" aria-label="The two versions of the civics test and the filing date that decides"
     style="min-width:0;max-width:340px;margin:0 auto">
  <style>
    .bg   { fill:#F5F0E6; }
    .card { fill:#ffffff; stroke:#D8D0BE; stroke-width:1; }
    .head { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
            fill:#9E2B25; letter-spacing:1.6px; }
    .ver  { font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:500; fill:#111D30; }
    .when { font-family:"IBM Plex Sans",sans-serif; font-size:12px; fill:#9E2B25; }
    .lab  { font-family:"IBM Plex Sans",sans-serif; font-size:12px; fill:#4A5468; }
    .num  { font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:500; fill:#111D30; }
    .foot { font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; fill:#4A5468; }
  </style>

  <rect class="bg" x="0" y="0" width="330" height="462"/>
  <text class="head" x="14" y="22">WHICH TEST APPLIES</text>
  <line x1="14" y1="32" x2="316" y2="32" stroke="#9E2B25" stroke-width="2"/>

  <rect class="card" x="14" y="46" width="302" height="166" rx="2"/>
  <text class="ver" x="28" y="76">2008 version</text>
  <text class="when" x="28" y="96">Filed before 20 October 2025</text>
  <line x1="28" y1="110" x2="302" y2="110" stroke="#E6DFCD" stroke-width="1"/>
  <text class="lab" x="28" y="132">Question bank</text>
  <text class="num" x="230" y="133">100</text>
  <text class="lab" x="28" y="160">Asked at the interview</text>
  <text class="num" x="230" y="161">10</text>
  <text class="lab" x="28" y="188">Correct answers to pass</text>
  <text class="num" x="230" y="189">6</text>

  <rect class="card" x="14" y="224" width="302" height="166" rx="2" stroke="#9E2B25" stroke-width="2"/>
  <text class="ver" x="28" y="254">2025 version</text>
  <text class="when" x="28" y="274">Filed on or after 20 October 2025</text>
  <line x1="28" y1="288" x2="302" y2="288" stroke="#E6DFCD" stroke-width="1"/>
  <text class="lab" x="28" y="310">Question bank</text>
  <text class="num" x="230" y="311">128</text>
  <text class="lab" x="28" y="338">Asked at the interview</text>
  <text class="num" x="230" y="339">20</text>
  <text class="lab" x="28" y="366">Correct answers to pass</text>
  <text class="num" x="230" y="367">12</text>

  <text class="foot" x="14" y="418">The filing date is on the receipt notice,</text>
  <text class="foot" x="14" y="435">Form I-797C. The interview date does</text>
  <text class="foot" x="14" y="452">not change which test applies.</text>
</svg>
